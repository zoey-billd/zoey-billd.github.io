<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="zg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3f3da"/>
      <stop offset="0.5" stop-color="#57e2b4"/>
      <stop offset="1" stop-color="#1fb78d"/>
    </linearGradient>
    <filter id="g" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.22  0 0 0 0 0.2  0 0 0 0.05 0"/>
    </filter>
  </defs>

  <!-- 白底（带极淡纸感噪点） -->
  <rect width="64" height="64" rx="14" fill="#fbfbf8"/>
  <rect width="64" height="64" rx="14" fill="url(#g)" opacity="0.5"/>

  <!-- 边缘细线（印刷描边感） -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#2a2824" stroke-opacity="0.18" stroke-width="1.4"/>

  <!-- 薄荷绿 Z（硬切角，保持印刷像素感） -->
  <path d="M18.5 17.5 H45.5 L24.5 46.5 H44" fill="none" stroke="url(#zg)" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt"/>

  <!-- 深色像素星（zine 点缀） -->
  <path d="M47 12.6 l1.3 2.7 2.7 1.3 -2.7 1.3 -1.3 2.7 -1.3 -2.7 -2.7 -1.3 2.7 -1.3 z" fill="#2bc89b"/>

  <!-- 印刷套准标记 -->
  <g stroke="rgba(42,40,36,0.35)" fill="none" stroke-width="1.1">
    <circle cx="50" cy="53" r="3"/>
    <path d="M50 47.5 V58.5 M43.5 53 H56.5"/>
  </g>

  <!-- 半调小点 -->
  <g fill="rgba(31,183,141,0.5)">
    <circle cx="10" cy="53" r="1.2"/><circle cx="14" cy="53" r="1.2"/>
    <circle cx="10" cy="57" r="1.2"/><circle cx="14" cy="57" r="1.2"/>
  </g>
</svg>