<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26231e"/>
      <stop offset="1" stop-color="#191712"/>
    </linearGradient>
    <linearGradient id="zgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b04a"/>
      <stop offset="0.55" stop-color="#ef8a35"/>
      <stop offset="1" stop-color="#d05c28"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.95  0 0 0 0 0.9  0 0 0 0 0.8  0 0 0 0.14 0"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#grain)" opacity="0.55"/>

  <!-- Z : gold-orange gradient, hard joins for pixel feel -->
  <path d="M18.5 17.5 H45.5 L24.5 46.5 H44" fill="none" stroke="url(#zgrad)" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt"/>

  <!-- pixel star accent -->
  <path d="M47 12.6 l1.3 2.7 2.7 1.3 -2.7 1.3 -1.3 2.7 -1.3 -2.7 -2.7 -1.3 2.7 -1.3 z" fill="#f6b04a"/>

  <!-- print registration mark, bottom-right -->
  <g stroke="rgba(255,255,255,0.28)" fill="none" stroke-width="1.1">
    <circle cx="50" cy="52" r="3"/>
    <path d="M50 46.5 V57.5 M43.5 52 H56.5"/>
  </g>

  <!-- halftone dots, bottom-left -->
  <g fill="rgba(246,176,74,0.4)">
    <circle cx="10" cy="53" r="1.2"/><circle cx="14" cy="53" r="1.2"/>
    <circle cx="10" cy="57" r="1.2"/><circle cx="14" cy="57" r="1.2"/>
    <circle cx="18" cy="53" r="1.2"/><circle cx="18" cy="57" r="1.2"/>
  </g>
</svg>
